<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMJ – Order Online</title>
<meta name="description" content="LMJ Surface Disinfectant (Pink Blossom, 100ml) kills 99.9% of germs. Order online, pay with Paystack, get it by pickup or delivery.">
<meta property="og:title" content="LMJ Surface Disinfectant – Pink Blossom">
<meta property="og:description" content="Kills 99.9% germs. Order online now – pickup or delivery.">
<meta property="og:image" content="/product.jpg">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/style.css">
<style>
  .product { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding: 12px; border: 1.5px solid var(--pink-100); border-radius: 14px; background: var(--white); margin-bottom: 10px; }
  .product img.main { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; background: var(--pink-50); cursor: zoom-in; }
  .product .strip { display: flex; gap: 4px; margin-top: 4px; }
  .product .strip img { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; border: 1.5px solid transparent; cursor: pointer; }
  .product .strip img.on { border-color: var(--pink-900); }
  .lightbox { position: fixed; inset: 0; background: rgba(58,31,43,.92); display: none; align-items: center; justify-content: center; z-index: 50; flex-direction: column; gap: 10px; }
  .lightbox.open { display: flex; }
  .lightbox img.big { max-width: 94vw; max-height: 78vh; border-radius: 12px; }
  .lightbox .dots { display: flex; gap: 8px; }
  .lightbox .dots img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
  .lightbox .dots img.on { border-color: #fff; }
  .lightbox .close { position: absolute; top: 14px; right: 18px; color: #fff; font-size: 30px; cursor: pointer; }
  .product .name { font-weight: 800; color: var(--pink-900); }
  .product .desc { font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
  .product .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .product .p { font-weight: 900; font-size: 18px; color: var(--pink-900); }
  .product .qty button { width: 36px; height: 36px; font-size: 18px; }
  .product .qty input { width: 48px; height: 36px; padding: 0; font-size: 15px; }
  .product.selected { border-color: var(--pink-500); background: var(--pink-50); }
  .hero.single img { max-height: 70vh; object-fit: contain; }
</style>
</head>
<body>
<header class="brand">
  <div class="logo" id="bizName">✦ LMJ</div>
  <div class="tag" id="tagline">ORDER ONLINE</div>
</header>

<div class="wrap">
  <div class="grid">
    <section class="hero" id="hero"><img src="/product.jpg" alt="Product"></section>

    <section class="card">
      <h2 style="margin-top:0">Choose your products</h2>
      <div id="products"></div>

      <form id="orderForm" autocomplete="on">
        <label for="name">Your name</label>
        <input id="name" name="name" placeholder="e.g. Ama Mensah" required>

        <label for="phone">Phone (WhatsApp) number</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="e.g. 0241234567" required>
        <div class="note">Order updates will be sent to this number by SMS and WhatsApp.</div>

        <label for="email">Email (optional, for your payment receipt)</label>
        <input id="email" name="email" type="email" placeholder="you@example.com">

        <label>How would you like to receive it?</label>
        <div class="choice">
          <label><input type="radio" name="fulfilment" value="pickup" checked><span>🏪 Pickup</span></label>
          <label><input type="radio" name="fulfilment" value="delivery"><span>🛵 Delivery</span></label>
        </div>
        <div class="note" id="pickupInfo" style="display:none"></div>

        <div id="addressWrap" style="display:none">
          <label for="address">Delivery address / landmark</label>
          <textarea id="address" name="address" placeholder="Area, street, house number or a landmark"></textarea>
        </div>

        <label for="note">Note to seller (optional)</label>
        <textarea id="note" name="note" placeholder="Any instructions…"></textarea>

        <div class="total"><span>Total</span><span id="total">GHS 0.00</span></div>
        <div class="error" id="err"></div>
        <button class="btn" id="submitBtn" type="submit">💳 Pay with Paystack & place order</button>
        <div class="note" id="payNote" style="text-align:center">Secure payment by card, MoMo or bank transfer via Paystack.</div>
      </form>

      <a class="btn secondary" id="callBtn" href="#">📞 Call to order</a>
      <a class="btn whatsapp" id="waBtn" href="#" target="_blank" rel="noopener">💬 Chat on WhatsApp</a>
      <div class="note" style="text-align:center"><a href="/track">Already ordered? Track your order →</a></div>
    </section>
  </div>
</div>

<footer id="footer"></footer>
<div class="lightbox" id="lb"><span class="close" id="lbClose">✕</span><img class="big" id="lbImg" src="" alt=""><div class="dots" id="lbDots"></div></div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const cfg = await fetch('/api/config').then(r => r.json());
  const P = cfg.products;
  document.title = cfg.businessName + ' – Order Online';
  $('bizName').textContent = '✦ ' + cfg.businessName;
  $('tagline').textContent = (cfg.tagline || 'Order online').toUpperCase();
  $('footer').textContent = cfg.footerNote || '';
  $('callBtn').href = 'tel:' + cfg.callPhone; $('callBtn').textContent = '📞 Call to order: ' + cfg.callPhone;
  if (cfg.pickupInfo) { $('pickupInfo').textContent = '🏪 ' + cfg.pickupInfo; $('pickupInfo').style.display = 'block'; }
  if (!cfg.paystack) { $('submitBtn').textContent = '🛒 Place order'; $('payNote').textContent = 'Pay on pickup or delivery.'; }

  // hero: first product image
  if (P[0] && P[0].image) { $('hero').querySelector('img').src = P[0].image; if (P.length === 1) $('hero').classList.add('single'); }

  const qtys = {};
  P.forEach((p, i) => { qtys[p.id] = (P.length === 1 && i === 0) ? 1 : 0; });
  $('products').innerHTML = P.length ? P.map(p => `
    <div class="product" id="prod-${p.id}">
      <div>
        <img class="main" src="${(p.images && p.images[0]) || p.image || '/product.jpg'}" alt="${p.name}" data-lb="${p.id}" data-i="0">
        ${p.images && p.images.length > 1 ? '<div class="strip">' + p.images.map((u, i) => `<img src="${u}" class="${i === 0 ? 'on' : ''}" data-sw="${p.id}" data-i="${i}" alt="">`).join('') + '</div>' : ''}
      </div>
      <div>
        <div class="name">${p.name}${p.size ? ' <small style="font-weight:600;color:var(--muted)">' + p.size + '</small>' : ''}</div>
        <div class="desc">${p.description || ''}</div>
        <div class="bottom">
          <span class="p">GHS ${Number(p.price).toFixed(2)}</span>
          <span class="qty"><button type="button" data-id="${p.id}" data-d="-1">−</button><input type="number" min="0" max="500" value="${qtys[p.id]}" data-id="${p.id}"><button type="button" data-id="${p.id}" data-d="1">+</button></span>
        </div>
      </div>
    </div>`).join('') : '<div class="note">No products available right now. Please check back soon.</div>';

  const fulfil = () => document.querySelector('input[name=fulfilment]:checked').value;
  function recalc() {
    let sub = 0;
    P.forEach(p => { sub += qtys[p.id] * Number(p.price); $('prod-' + p.id).classList.toggle('selected', qtys[p.id] > 0); });
    const del = fulfil() === 'delivery' ? cfg.deliveryFee : 0;
    $('total').textContent = 'GHS ' + (sub + del).toFixed(2) + (del ? ` (incl. GHS ${del} delivery)` : '');
  }
  $('products').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    const id = b.dataset.id; qtys[id] = Math.max(0, Math.min(500, qtys[id] + Number(b.dataset.d)));
    document.querySelector(`input[data-id="${id}"]`).value = qtys[id]; recalc();
  });
  // photo gallery: thumbnails swap the main image; tapping the main image opens a full-screen viewer
  const imgsOf = (id) => { const p = P.find(x => x.id === id); return (p.images && p.images.length ? p.images : [p.image || '/product.jpg']); };
  let lbId = null;
  function showLb(id, i) {
    lbId = id; const list = imgsOf(id);
    $('lbImg').src = list[i];
    $('lbDots').innerHTML = list.length > 1 ? list.map((u, j) => `<img src="${u}" class="${j === i ? 'on' : ''}" data-j="${j}" alt="">`).join('') : '';
    $('lb').classList.add('open');
  }
  $('products').addEventListener('click', e => {
    const sw = e.target.closest('img[data-sw]');
    if (sw) { const card = $('prod-' + sw.dataset.sw); card.querySelector('img.main').src = sw.src; card.querySelector('img.main').dataset.i = sw.dataset.i; card.querySelectorAll('.strip img').forEach(x => x.classList.toggle('on', x === sw)); return; }
    const mn = e.target.closest('img[data-lb]');
    if (mn) showLb(mn.dataset.lb, +mn.dataset.i);
  });
  $('lbDots').addEventListener('click', e => { const d = e.target.closest('img[data-j]'); if (d) showLb(lbId, +d.dataset.j); });
  $('lbClose').onclick = () => $('lb').classList.remove('open');
  $('lb').addEventListener('click', e => { if (e.target === $('lb')) $('lb').classList.remove('open'); });

  $('products').addEventListener('input', e => {
    const i = e.target.closest('input[data-id]'); if (!i) return;
    qtys[i.dataset.id] = Math.max(0, Math.min(500, parseInt(i.value, 10) || 0)); recalc();
  });
  document.querySelectorAll('input[name=fulfilment]').forEach(r => r.onchange = () => { $('addressWrap').style.display = fulfil() === 'delivery' ? 'block' : 'none'; recalc(); });
  recalc();

  $('orderForm').onsubmit = async (e) => {
    e.preventDefault();
    const err = $('err'); err.style.display = 'none';
    const items = P.filter(p => qtys[p.id] > 0).map(p => ({ id: p.id, qty: qtys[p.id] }));
    if (!items.length) { err.textContent = 'Please choose at least one product.'; err.style.display = 'block'; return; }
    const btn = $('submitBtn'); const label = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…';
    const body = { name: $('name').value, phone: $('phone').value, email: $('email').value, items, fulfilment: fulfil(), address: $('address').value, note: $('note').value };
    try {
      const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Something went wrong');
      location.href = data.paymentUrl || data.trackUrl || ('/track?id=' + data.orderId);
    } catch (ex) { err.textContent = ex.message; err.style.display = 'block'; btn.disabled = false; btn.textContent = label; }
  };

  const waText = 'Hello ' + cfg.businessName + ', I would like to place an order.';
  $('waBtn').href = `https://wa.me/${cfg.whatsappPhone}?text=${encodeURIComponent(waText)}`;
})();
</script>
</body>
</html>
